name: 功能建议
description: 想要的东西现在配不出来
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先说清一件事：这个项目有意保持范围窄——**单 Agent / 单工作流项目 + 确定性校验 + 逐字节导出**。
        靠近这个范围的需求更容易被采纳；拖拽画布、多租户鉴权、UI 里写 Go 代码属于明确不做的事（见 README「已知边界」）。

  - type: textarea
    id: problem
    attributes:
      label: 你被什么卡住了
      description: 描述场景，而不是先给方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想怎么解决

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 现在是怎么绕过去的？

  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      multiple: true
      options:
        - manifest / schema
        - kit（运行时拼装）
        - Web UI
        - HTTP API
        - 导出 / codegen
        - verify
        - 文档
