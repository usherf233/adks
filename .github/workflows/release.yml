name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: test before shipping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...

  # 每个目标独立 job：并行编译，且各自复用模块缓存，
  # 比在一个 job 里串行交叉编译五个平台快得多。
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, archive: tar.gz }
          - { goos: linux, goarch: arm64, archive: tar.gz }
          - { goos: darwin, goarch: amd64, archive: tar.gz }
          - { goos: darwin, goarch: arm64, archive: tar.gz }
          - { goos: windows, goarch: amd64, archive: zip }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="adks-${GOOS}-${GOARCH}"
          bin="$name"
          if [ "$GOOS" = "windows" ]; then bin="$name.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" ./cmd/adks
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -q "$name.zip" "$bin"
          else
            tar -czf "$name.tar.gz" "$bin"
          fi
          rm -f "$bin"

      - uses: actions/upload-artifact@v4
        with:
          name: adks-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
