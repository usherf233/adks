name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · vet · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 先跑最便宜的那条：格式漂移在 review 里没人愿意提，机器提最好。
      # Windows runner 默认是 pwsh，这段是 bash 语法，必须显式指定。
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  build-binary:
    name: embed check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 二进制能构建出来，才说明 web/ kit/ manifest/ 的 embed 是完整的。
      - name: build binary
        run: go build -trimpath -ldflags "-X main.version=ci" -o adks ./cmd/adks

      - name: smoke test
        run: |
          ./adks version
          ./adks serve -port 17788 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17788/api/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 1
          done
          echo "health check timed out"
          exit 1

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 版本写死：扫描结论是要拿来当闸门的，扫描器自己不能每次跑漂一个版本。
      # 用 go run 而不是预装动作，省掉一个需要单独信任的第三方 step。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
