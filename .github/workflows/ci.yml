name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · vet · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 先跑最便宜的那条：格式漂移在 review 里没人愿意提，机器提最好。
      # Windows runner 默认是 pwsh，这段是 bash 语法，必须显式指定。
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        shell: bash
        # 失败时把失败条目打成 annotation：Actions 原始日志要鉴权才能读，annotation
        # 走 API 就能取到。用 -json 是结构化的，不靠猜日志格式——上一次靠 grep
        # "--- FAIL" 一条都没抓到，说明那种启发式在真实失败面前不可靠。
        run: |
          set +e
          go test -json -race -count=1 ./... > test.json
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -o '"Action":"fail"[^}]*}' test.json | head -8 | while IFS= read -r line; do
              echo "::error title=go test fail::${line}"
            done
            # 编译错误的原文在最前面，FAIL 摘要最后面；两头都要抓，否则只看到
            # "build failed" 而看不到到底哪一行错。Go 1.24 起编译错误走
            # "build-output" 而不是 "output"，两个都要匹配。
            grep -oE '"Action":"(output|build-output)"[^}]*"Output":"[^"]*"' test.json \
              | grep -Ei 'undefined|cannot|error:|not found|address already|build failed' \
              | head -6 | sed 's/\\n/ | /g' | while IFS= read -r line; do
              echo "::error title=go test reason::${line}"
            done
            grep -o '"Action":"output"[^}]*"Output":"[^"]*"' test.json \
              | grep -E 'FAIL' | tail -4 | sed 's/\\n/ | /g' | while IFS= read -r line; do
              echo "::error title=go test summary::${line}"
            done
          fi
          exit "$status"

  build-binary:
    name: embed check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 二进制能构建出来，才说明 web/ kit/ manifest/ 的 embed 是完整的。
      - name: build binary
        run: go build -trimpath -ldflags "-X main.version=ci" -o adks ./cmd/adks

      - name: smoke test
        run: |
          ./adks version
          ./adks serve -port 17788 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17788/api/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 1
          done
          echo "health check timed out"
          exit 1

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 版本写死：扫描结论是要拿来当闸门的，扫描器自己不能每次跑漂一个版本。
      # 用 go run 而不是预装动作，省掉一个需要单独信任的第三方 step。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
