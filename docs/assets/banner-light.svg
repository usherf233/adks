<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="adks — Google ADK (Go) builder and exporter">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="lack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="lstroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="lgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d1117" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#lbg)"/>
  <rect width="1280" height="320" fill="url(#lgrid)"/>
  <rect x="0" y="317" width="1280" height="3" fill="url(#lstroke)" opacity="0.9"/>

  <g transform="translate(80,96)">
    <rect x="0" y="0" width="128" height="128" rx="30" fill="none" stroke="url(#lack)" stroke-width="3"/>
    <circle cx="40" cy="40" r="10" fill="url(#lack)"/>
    <circle cx="88" cy="40" r="7" fill="#0ea5e9" opacity="0.75"/>
    <circle cx="64" cy="72" r="9" fill="url(#lack)"/>
    <circle cx="40" cy="98" r="7" fill="#6366f1" opacity="0.45"/>
    <circle cx="88" cy="98" r="10" fill="url(#lack)"/>
    <g stroke="#6366f1" stroke-opacity="0.55" stroke-width="2" fill="none">
      <path d="M40 40 L64 72"/>
      <path d="M88 40 L64 72"/>
      <path d="M64 72 L40 98"/>
      <path d="M64 72 L88 98"/>
      <path d="M40 98 L88 98"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="252" y="146" font-size="76" font-weight="700" fill="#0d1117" letter-spacing="-2">adks</text>
    <text x="256" y="188" font-size="23" fill="#3d444d" letter-spacing="0.2">Google ADK (Go) · 浏览器里配 Agent，一键导出 Go 工程</text>
    <g font-size="16" font-weight="600" letter-spacing="0.6">
      <rect x="256" y="212" width="112" height="34" rx="17" fill="#6366f1" fill-opacity="0.10" stroke="#6366f1" stroke-opacity="0.35"/>
      <text x="312" y="234" text-anchor="middle" fill="#4f46e5">single binary</text>
      <rect x="380" y="212" width="92" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.10" stroke="#0ea5e9" stroke-opacity="0.35"/>
      <text x="426" y="234" text-anchor="middle" fill="#0284c7">no Node</text>
      <rect x="484" y="212" width="118" height="34" rx="17" fill="#0d1117" fill-opacity="0.05" stroke="#0d1117" stroke-opacity="0.18"/>
      <text x="543" y="234" text-anchor="middle" fill="#24292f">byte-identical</text>
    </g>
  </g>

  <g transform="translate(896,92)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="304" height="136" rx="14" fill="#ffffff" stroke="#0d1117" stroke-opacity="0.12"/>
    <rect x="0" y="0" width="304" height="30" rx="14" fill="#0d1117" fill-opacity="0.03"/>
    <circle cx="20" cy="15" r="4" fill="#ff5f57" fill-opacity="0.8"/>
    <circle cx="36" cy="15" r="4" fill="#febc2e" fill-opacity="0.8"/>
    <circle cx="52" cy="15" r="4" fill="#28c840" fill-opacity="0.8"/>
    <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a">
      <text x="18" y="60"><tspan fill="#4f46e5">$</tspan> adks serve</text>
      <text x="18" y="84" fill="#8b949e">home   ~/.adks</text>
      <text x="18" y="106" fill="#8b949e">listen http://127.0.0.1:7788</text>
      <text x="18" y="126"><tspan fill="#0284c7">→</tspan> export: kit + manifest, verbatim</text>
    </g>
  </g>
</svg>
