<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="adks — Google ADK (Go) builder and exporter">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="dack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dstroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e6edf3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#dbg)"/>
  <rect width="1280" height="320" fill="url(#dgrid)"/>
  <rect x="0" y="317" width="1280" height="3" fill="url(#dstroke)" opacity="0.85"/>

  <g transform="translate(80,96)">
    <rect x="0" y="0" width="128" height="128" rx="30" fill="none" stroke="url(#dack)" stroke-width="3"/>
    <circle cx="40" cy="40" r="10" fill="url(#dack)"/>
    <circle cx="88" cy="40" r="7" fill="#38bdf8" opacity="0.8"/>
    <circle cx="64" cy="72" r="9" fill="url(#dack)"/>
    <circle cx="40" cy="98" r="7" fill="#818cf8" opacity="0.55"/>
    <circle cx="88" cy="98" r="10" fill="url(#dack)"/>
    <g stroke="#818cf8" stroke-opacity="0.6" stroke-width="2" fill="none">
      <path d="M40 40 L64 72"/>
      <path d="M88 40 L64 72"/>
      <path d="M64 72 L40 98"/>
      <path d="M64 72 L88 98"/>
      <path d="M40 98 L88 98"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="252" y="146" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">adks</text>
    <text x="256" y="188" font-size="23" fill="#aab6c6" letter-spacing="0.2">Google ADK (Go) · 浏览器里配 Agent，一键导出 Go 工程</text>
    <g font-size="16" font-weight="600" letter-spacing="0.6">
      <rect x="256" y="212" width="112" height="34" rx="17" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="312" y="234" text-anchor="middle" fill="#a5b4fc">single binary</text>
      <rect x="380" y="212" width="92" height="34" rx="17" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="426" y="234" text-anchor="middle" fill="#7dd3fc">no Node</text>
      <rect x="484" y="212" width="118" height="34" rx="17" fill="#e6edf3" fill-opacity="0.08" stroke="#e6edf3" stroke-opacity="0.28"/>
      <text x="543" y="234" text-anchor="middle" fill="#c9d1d9">byte-identical</text>
    </g>
  </g>

  <g transform="translate(896,92)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="304" height="136" rx="14" fill="#161b22" stroke="#e6edf3" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="304" height="30" rx="14" fill="#e6edf3" fill-opacity="0.05"/>
    <circle cx="20" cy="15" r="4" fill="#ff5f57" fill-opacity="0.85"/>
    <circle cx="36" cy="15" r="4" fill="#febc2e" fill-opacity="0.85"/>
    <circle cx="52" cy="15" r="4" fill="#28c840" fill-opacity="0.85"/>
    <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">
      <text x="18" y="60"><tspan fill="#a5b4fc">$</tspan> adks serve</text>
      <text x="18" y="84" fill="#6e7681">home   ~/.adks</text>
      <text x="18" y="106" fill="#6e7681">listen http://127.0.0.1:7788</text>
      <text x="18" y="126"><tspan fill="#7dd3fc">→</tspan> export: kit + manifest, verbatim</text>
    </g>
  </g>
</svg>
