<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="adks — Google ADK (Go) builder and exporter">
  <defs>
    <radialGradient id="glow1" cx="0.18" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0b0f16"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <g transform="translate(96,150)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="none" stroke="url(#accentFill)" stroke-width="2.5"/>
    <circle cx="27" cy="27" r="7" fill="url(#accentFill)"/>
    <circle cx="61" cy="27" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="44" cy="49" r="6" fill="url(#accentFill)"/>
    <circle cx="27" cy="68" r="5" fill="#818cf8" opacity="0.6"/>
    <circle cx="61" cy="68" r="7" fill="url(#accentFill)"/>
    <g stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.6" fill="none">
      <path d="M27 27 L44 49"/><path d="M61 27 L44 49"/><path d="M44 49 L27 68"/><path d="M44 49 L61 68"/><path d="M27 68 L61 68"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="330" font-size="96" font-weight="700" fill="#f0f4f9" letter-spacing="-3">adks</text>
    <text x="100" y="386" font-size="30" fill="#c3cddb">在浏览器里配一个 Agent，导出一份能编译的 Go 工程</text>
    <text x="100" y="428" font-size="22" fill="#7d8b9e">Google ADK for Go · 单二进制 · 无 Node · 导出逐字节复制</text>

    <g font-size="18" font-weight="600">
      <rect x="100" y="466" width="150" height="44" rx="22" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="175" y="494" text-anchor="middle" fill="#b3bcfc">single binary</text>
      <rect x="262" y="466" width="122" height="44" rx="22" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45"/>
      <text x="323" y="494" text-anchor="middle" fill="#8ed8fb">no Node</text>
      <rect x="396" y="466" width="168" height="44" rx="22" fill="#e6edf3" fill-opacity="0.07" stroke="#e6edf3" stroke-opacity="0.24"/>
      <text x="480" y="494" text-anchor="middle" fill="#c9d1d9">byte-identical</text>
      <rect x="576" y="466" width="150" height="44" rx="22" fill="#e6edf3" fill-opacity="0.07" stroke="#e6edf3" stroke-opacity="0.24"/>
      <text x="651" y="494" text-anchor="middle" fill="#c9d1d9">deterministic</text>
    </g>
  </g>

  <g transform="translate(872,250)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="312" height="180" rx="16" fill="#111722" stroke="#e6edf3" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="312" height="34" rx="16" fill="#e6edf3" fill-opacity="0.05"/>
    <circle cx="22" cy="17" r="4.5" fill="#ff5f57" fill-opacity="0.85"/>
    <circle cx="40" cy="17" r="4.5" fill="#febc2e" fill-opacity="0.85"/>
    <circle cx="58" cy="17" r="4.5" fill="#28c840" fill-opacity="0.85"/>
    <g font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">
      <text x="20" y="72"><tspan fill="#b3bcfc">$</tspan> adks serve</text>
      <text x="20" y="104" fill="#6e7681">listen http://127.0.0.1:7788</text>
      <text x="20" y="134"><tspan fill="#8ed8fb">→</tspan> verify  build · vet · smoke</text>
      <text x="20" y="162"><tspan fill="#8ed8fb">→</tspan> export  go run .</text>
    </g>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)"/>
</svg>
